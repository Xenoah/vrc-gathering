name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Run unit and service-worker mock tests
        run: npm test
      - name: Check extension and GAS syntax
        run: |
          for file in extension/*.js; do node --check "$file"; done
          npm run check:gas
      - name: Validate and build distribution
        run: python scripts/package_release.py
