name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Run unit and service-worker mock tests
        run: npm test
      - name: Check extension and GAS syntax
        run: |
          for file in extension/*.js; do node --check "$file"; done
          npm run check:gas
      - name: Verify tag and build distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --tag "$RELEASE_TAG"
      - name: Publish release with ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_title="$(sed -n '1s/^# //p' RELEASE_NOTES.md)"
          test -n "$release_title"
          gh release create "$RELEASE_TAG" \
            "dist/vrc-gathering-${RELEASE_TAG}.zip" \
            "dist/vrc-gathering-${RELEASE_TAG}.zip.sha256" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --title "$release_title" \
            --notes-file RELEASE_NOTES.md \
            --latest
