name: Release

on:
  push:
    tags: ['v*']
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag' || github.event.head_commit.message == 'release: publish v0.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Run unit and service-worker mock tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in extension/*.js; do node --check "$file"; done
      - name: Resolve release version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify tag and build distribution
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/package_release.py --tag "$RELEASE_TAG"
      - name: Publish release with ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/vrc-gathering-${RELEASE_TAG}.zip" \
            "dist/vrc-gathering-${RELEASE_TAG}.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "${RELEASE_TAG} — First release" \
            --notes-file RELEASE_NOTES.md \
            --latest
